name: Android build (TWA)

# Manual run: builds a signed Android App Bundle (.aab) for Google Play from the live site.
# The upload keystore and its password live only in repository secrets; they are never printed or uploaded.
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Point Bubblewrap at the preinstalled JDK and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME_17_X64" "$ANDROID_HOME" > ~/.bubblewrap/config.json
      - name: Make the SDK match what Bubblewrap expects (tools folder, build-tools 36.1.0)
        run: |
          sudo chmod -R a+rwX "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;36.1.0"
      - name: Prepare project
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir build
          sed "s/__VERSION_CODE__/${{ github.run_number }}/" android/twa-manifest.json > build/twa-manifest.json
          printf '%s' "$KEYSTORE_B64" | base64 -d > build/upload.p12
      - name: Generate and build
        working-directory: build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx --yes @bubblewrap/cli@1.27.0 update --skipVersionUpgrade --manifest=./twa-manifest.json
          # androidbrowserhelper 2.7.x 는 시작할 때 ManageDataLauncherActivity 를 켜고 끈다(setComponentEnabledSetting).
          # Bubblewrap 이 만든 매니페스트에는 이 선언이 없어서 앱이 시작하자마자 죽는다
          # ("Component class ... ManageDataLauncherActivity does not exist"). 선언을 넣고, 코드 축소(R8)도 끈다.
          python3 - <<'PY'
          import re
          path = "app/src/main/AndroidManifest.xml"
          text = open(path, encoding="utf-8").read()
          if "ManageDataLauncherActivity" not in text:
              marker = '<activity android:name="com.google.androidbrowserhelper.trusted.FocusActivity"'
              assert marker in text, "FocusActivity marker not found"
              block = ('<activity android:name="com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity" android:exported="false">\n'
                       '            <meta-data android:name="android.support.customtabs.trusted.MANAGE_SPACE_URL" android:value="@string/launchUrl" />\n'
                       '        </activity>\n\n        ')
              text = text.replace(marker, block + marker, 1)
              open(path, "w", encoding="utf-8").write(text)
          gradle = "app/build.gradle"
          g = open(gradle, encoding="utf-8").read()
          g2 = g.replace("minifyEnabled true", "minifyEnabled false")
          assert "minifyEnabled false" in g2, "minifyEnabled not found"
          open(gradle, "w", encoding="utf-8").write(g2)
          PY
          grep -q ManageDataLauncherActivity app/src/main/AndroidManifest.xml
          grep -q "minifyEnabled false" app/build.gradle
          npx --yes @bubblewrap/cli@1.27.0 build --skipPwaValidation --manifest=./twa-manifest.json
      - name: Upload the bundle (signed with the upload key only)
        uses: actions/upload-artifact@v4
        with:
          name: word-relay-aab
          path: |
            build/app-release-bundle.aab
            build/app-release-signed.apk
